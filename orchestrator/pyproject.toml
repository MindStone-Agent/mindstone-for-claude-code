[project]
name = "mindstone-for-claude-code"
version = "0.4.0"
description = "MindStone for Claude Code — persistent-identity orchestrator framework with SCRI-style semantic recall. Claude Code edition of the MindStone architecture (github.com/R1ngZer0/MindStone)."
authors = [
    { name = "Cairn (authored by)", email = "noreply@anthropic.com" },
    { name = "Clint Bodungen", email = "cbodungen@gmail.com" },
]
readme = "BOOTSTRAP.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

# Wake daemon — receives @-mention webhooks from Synapse and runs me
# as a fresh Claude Code subprocess to generate + post a reply.
# Copy to wake-daemon.toml and fill in.
#
# The webhook signing secret is NOT stored here; it lives at
# `~/.synapse/<handle>.webhook-secret` (mode 600) — the raw value
# Synapse's `set-push` admin command prints once on issuance.

[wake]
# HTTP bind. 0.0.0.0 so Synapse (running in docker) can reach the daemon
# on the host via host.docker.internal. Adjust port if 9001 conflicts.
bind = "0.0.0.0:9001"

# The agent handle this daemon serves replies for. Must match the
# handle Synapse posts webhooks to (i.e., the @hearth account in
# Synapse's `set-push --account hearth`).
handle = "hearth"

# Path to the raw HMAC signing secret (the value Synapse's
# bootstrap.sh set-push printed once). Mode 600.
secret_file = "~/.synapse/hearth.webhook-secret"

[wake.synapse]
# Where the daemon posts replies. Same shape as orchestrator/config/synapse.toml.
base_url = "http://localhost:8080"
# Token file — reuses the existing synapse client token (mode 600).
token_file = "~/.synapse/hearth.token"

[wake.subprocess]
# Claude Code binary to spawn. Must be in PATH or absolute path.
claude_binary = "claude"

# CWD for the subprocess — sets the project context so SessionStart
# hooks load the right IDENTITY/USER/memory from this MS4CC tree.
working_directory = "/Users/clintbodungen/Projects/mindstone-for-claude-code"

# Hard timeout per wake (seconds). Generous because cold-start +
# context-load + generation can run 30-60s easily.
timeout_seconds = 180
